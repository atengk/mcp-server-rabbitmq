[project]
name = "atengk-mcp-server-rabbitmq"
version = "1.0.2"
description = "🐰 专为 LLM 打造的生产级 RabbitMQ Model Context Protocol (MCP) 服务端，支持 AMQP 拓扑声明、消息发布与消费、队列监控与管理能力"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "孔余", email = "2385569970@qq.com" }
]
keywords = ["mcp", "model-context-protocol", "rabbitmq", "amqp", "llm", "fastmcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]
dependencies = [
    "mcp>=1.3.0",
    "aio-pika>=9.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/atengk/mcp-server-rabbitmq"
Documentation = "https://github.com/atengk/mcp-server-rabbitmq#readme"
Repository = "https://github.com/atengk/mcp-server-rabbitmq"
Issues = "https://github.com/atengk/mcp-server-rabbitmq/issues"
Changelog = "https://github.com/atengk/mcp-server-rabbitmq/releases"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
atengk-mcp-server-rabbitmq = "mcp_server_rabbitmq:main"
mcp-server-rabbitmq = "mcp_server_rabbitmq:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_rabbitmq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
