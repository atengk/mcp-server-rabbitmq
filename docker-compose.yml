# ==============================================================================
# atengk-mcp-server-rabbitmq 生产级常驻 SSE 模式 Docker Compose 编排
# 默认拉取 GitHub Container Registry 官方多架构镜像 (amd64/arm64)
# ==============================================================================

services:
  mcp-server-rabbitmq:
    # 官方镜像 (由 GitHub Actions 自动化多架构构建与发布)
    image: ghcr.io/atengk/mcp-server-rabbitmq:latest

    # 若需要基于本地源码二次开发构建，解除下方 build 块注释即可:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: mcp-server-rabbitmq
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # RabbitMQ AMQP 连接 URL（连接宿主机外部 RabbitMQ 时使用 host.docker.internal）
      - MCP_RABBITMQ_URL=${MCP_RABBITMQ_URL:-amqp://guest:guest@host.docker.internal:5672/}

      # RabbitMQ Management HTTP API 地址
      - MCP_RABBITMQ_MANAGEMENT_URL=${MCP_RABBITMQ_MANAGEMENT_URL:-http://host.docker.internal:15672}

      # 运行时日志级别 (DEBUG, INFO, WARNING, ERROR)
      - MCP_RABBITMQ_LOG_LEVEL=${MCP_RABBITMQ_LOG_LEVEL:-INFO}

      # 双模传输网关协议与监听参数 (常驻 SSE 模式)
      - MCP_RABBITMQ_TRANSPORT=sse
      - MCP_RABBITMQ_SERVER_HOST=0.0.0.0
      - MCP_RABBITMQ_SERVER_PORT=8000

      # 安全写保护门禁开关 (默认只读 False；若允许声明拓扑/清空删除队列/发布消息，取消下方注释)
      # - MCP_RABBITMQ_ALLOW_WRITE=true

    # 若需要基于 connections.yaml 配置多实例，解除下方 volumes 挂载注释并指定 command:
    # command: ["--config", "/app/connections.yaml", "--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    # volumes:
    #   - ./connections.yaml:/app/connections.yaml:ro
    extra_hosts:
      # 跨平台宿主机网络互通 (支持 Linux/macOS/Windows)
      - "host.docker.internal:host-gateway"
